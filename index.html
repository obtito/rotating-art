<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="水墨双鲤与礼服人物，旋转半圈，看见另一幅画。可切换原彩色海洋版，支持手机拖动互动。">
  <meta name="art-version" content="ink-primary-20261105">
  <title>旋转互动画</title>
  <style>
    :root { color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:#242424; background:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; padding:28px 16px 32px; }
    main { width:100%; max-width:600px; margin:auto; display:grid; gap:20px; }
    header { display:grid; gap:8px; }
    h1 { font-size:22px; font-weight:500; letter-spacing:.12em; margin:0; }
    p { margin:0; font-size:14px; line-height:1.6; color:#666; }
    .styles { display:flex; gap:8px; flex-wrap:wrap; }
    button { font:inherit; font-size:14px; min-height:44px; border:1px solid #d7d7d7; border-radius:6px; background:#fff; color:#333; padding:10px 15px; cursor:pointer; }
    button[aria-pressed="true"],.turn { background:#262626; color:#fff; border-color:#262626; }
    button:focus-visible,input:focus-visible { outline:2px solid #747474; outline-offset:3px; }
    button:disabled { opacity:.6; cursor:wait; }
    .stage { width:100%; aspect-ratio:1; background:linear-gradient(90deg,#fff 0%,#fff 50%,#000 50%,#000 100%); overflow:hidden; touch-action:none; cursor:grab; }
    .stage:active { cursor:grabbing; }
    .stage img { width:100%; height:100%; display:block; object-fit:contain; transform:rotate(180deg); transform-origin:50% 50%; user-select:none; -webkit-user-drag:none; pointer-events:none; }
    .controls { display:grid; gap:12px; }
    .status-row { display:flex; justify-content:space-between; align-items:center; gap:16px; font-size:14px; }
    output { color:#666; font-variant-numeric:tabular-nums; }
    input[type="range"] { width:100%; min-height:32px; margin:0; accent-color:#333; }
    .actions { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .hint { font-size:13px; color:#737373; }
    .error { color:#973524; font-size:14px; }
    [hidden] { display:none!important; }
    @media (max-width:400px) { body { padding:22px 14px 28px; } main { gap:16px; } .styles button { flex:1; padding-inline:10px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>旋转互动画</h1>
    <p data-description>樱花双鲤 · 礼服人物</p>
  </header>
  <div class="styles" role="group" aria-label="画面风格">
    <button type="button" data-style="ink" aria-pressed="true">水墨 · 樱花双鲤</button>
    <button type="button" data-style="color" aria-pressed="false">彩色 · 海洋</button>
  </div>
  <div class="stage" aria-label="旋转图画，起始为樱花双鲤。拖动或使用下方滑杆可旋转。">
    <img src="assets/ink-c7ef90814060.webp" width="1254" height="1254" alt="樱花双鲤与礼服人物共用的透明旋转画" draggable="false" fetchpriority="high">
  </div>
  <div class="controls">
    <label class="status-row" for="rotation-angle"><span data-state aria-live="polite">樱花双鲤</span><output for="rotation-angle" data-angle>180°</output></label>
    <input type="range" id="rotation-angle" min="0" max="360" step="1" value="180" aria-label="旋转角度">
    <div class="actions"><button class="turn" type="button" data-turn>旋转180°</button><span class="hint">也可以拖动画面或滑杆</span></div>
  </div>
  <p class="error" role="alert" data-error hidden>图片暂时加载失败，请刷新页面重试。</p>
  <span data-loading aria-live="polite" class="hint" hidden>正在加载画面…</span>
</main>
<script>
(() => {
  const variants={"ink":{"src":"assets/ink-c7ef90814060.webp","background":"linear-gradient(90deg,rgb(255,255,255) 0%,rgb(255,255,255) 50%,rgb(0,0,0) 50%,rgb(0,0,0) 100%)","people":"礼服人物","animals":"樱花双鲤","description":"樱花双鲤 · 礼服人物","alt":"樱花双鲤与礼服人物共用的透明旋转画","stageLabel":"水墨旋转图画，0度呈现礼服人物，180度呈现樱花双鲤。可拖动或使用滑杆旋转。"},"color":{"src":"assets/color-f4a78d4d5286.webp","background":"linear-gradient(90deg,rgb(255,226,25) 0%,rgb(255,226,25) 50%,rgb(21,42,211) 50%,rgb(21,42,211) 100%)","people":"人物画面","animals":"鲨鱼与海豚","description":"鲨鱼与海豚 · 校服人物","alt":"校服人物与鲨鱼、海豚共用的透明旋转画","stageLabel":"彩色旋转图画，0度呈现人物，180度呈现左侧海豚和右侧鲨鱼。可拖动或使用滑杆旋转。"}};
  const stage=document.querySelector('.stage'),art=stage.querySelector('img');
  const range=document.getElementById('rotation-angle'),angleLabel=document.querySelector('[data-angle]');
  const state=document.querySelector('[data-state]'),description=document.querySelector('[data-description]');
  const buttons=Array.from(document.querySelectorAll('[data-style]'));
  const error=document.querySelector('[data-error]'),loading=document.querySelector('[data-loading]');
  let style='ink',angle=180,frame=0,drag=null,request=0;
  const normalize=value=>((value%360)+360)%360;
  function draw(value) {
    angle=value;const normalized=normalize(value);
    art.style.transform='rotate('+value+'deg)';range.value=normalized;angleLabel.value=Math.round(normalized)+'°';
    const current=variants[style];
    const text=(normalized<.1||normalized>359.9)?current.people:Math.abs(normalized-180)<.1?current.animals:'旋转中';
    if(state.textContent!==text)state.textContent=text;
  }
  const cache=new Map();
  async function selectStyle(next) {
    const token=++request;
    cancelAnimationFrame(frame);drag=null;loading.hidden=true;error.hidden=true;
    if(next===style)return;
    loading.hidden=false;error.hidden=true;
    try {
      let pending=cache.get(next);
      if(!pending){const picture=new Image();picture.src=variants[next].src;pending=picture.decode();cache.set(next,pending);}
      await pending;
      if(token!==request)return;
      cancelAnimationFrame(frame);drag=null;
      style=next;const selected=variants[style];
      art.src=selected.src;art.alt=selected.alt;stage.style.background=selected.background;
      stage.setAttribute('aria-label',selected.stageLabel);
      description.textContent=selected.description;
      buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.style===style)));
      draw(angle);
    } catch {
      cache.delete(next);if(token===request)error.hidden=false;
    } finally {if(token===request)loading.hidden=true;}
  }
  buttons.forEach(button=>button.addEventListener('click',()=>selectStyle(button.dataset.style)));
  range.addEventListener('input',()=>{cancelAnimationFrame(frame);draw(Number(range.value));});
  document.querySelector('[data-turn]').addEventListener('click',()=>{
    cancelAnimationFrame(frame);drag=null;
    const from=angle,target=from+180;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw(target);return;}
    const beginning=performance.now();
    function step(now){const t=Math.min(1,(now-beginning)/2400),e=t*t*(3-2*t);draw(from+180*e);if(t<1)frame=requestAnimationFrame(step);}
    frame=requestAnimationFrame(step);
  });
  function pointerAngle(event){const box=stage.getBoundingClientRect();return Math.atan2(event.clientY-box.top-box.height/2,event.clientX-box.left-box.width/2)*180/Math.PI;}
  stage.addEventListener('pointerdown',event=>{
    if(drag||event.button!==0)return;
    cancelAnimationFrame(frame);drag={id:event.pointerId,last:pointerAngle(event)};stage.setPointerCapture(event.pointerId);
  });
  stage.addEventListener('pointermove',event=>{
    if(!drag||drag.id!==event.pointerId)return;
    const current=pointerAngle(event);let delta=current-drag.last;
    if(delta>180)delta-=360;if(delta< -180)delta+=360;
    drag.last=current;draw(angle+delta);
  });
  function finish(event){if(drag?.id===event.pointerId)drag=null;}
  stage.addEventListener('pointerup',finish);stage.addEventListener('pointercancel',finish);stage.addEventListener('lostpointercapture',finish);
  art.addEventListener('load',()=>{error.hidden=true;});
  art.addEventListener('error',()=>{error.hidden=false;});
  draw(180);
})();
</script>
</body>
</html>
